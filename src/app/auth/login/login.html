<main class="login-page">
  <mat-card appearance="outlined" class="login-card">
    <mat-card-header>
      <mat-card-title>Iniciar sesión</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
          @if (form.get('email')?.invalid && form.get('email')?.touched) {
            <mat-error>Ingresá un email válido</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
          @if (form.get('password')?.invalid && form.get('password')?.touched) {
            <mat-error>La contraseña es obligatoria</mat-error>
          }
        </mat-form-field>

        @if (errorMessage()) {
          <p class="error-text" role="alert">{{ errorMessage() }}</p>
        }

        <button mat-flat-button color="primary" type="submit" [disabled]="loading()" class="full-width">
          @if (loading()) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            Ingresar
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</main>
