<main>
  <h1>Libros</h1>

  @if (loading()) {
    <mat-spinner diameter="40"></mat-spinner>
  } @else if (errorMessage()) {
    <p>{{ errorMessage() }}</p>
  } @else {
    <table mat-table [dataSource]="dataSource()">
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Título</th>
        <td mat-cell *matCellDef="let book">{{ book.title }}</td>
      </ng-container>

      <ng-container matColumnDef="isbn">
        <th mat-header-cell *matHeaderCellDef>ISBN</th>
        <td mat-cell *matCellDef="let book">{{ book.isbn }}</td>
      </ng-container>

      <ng-container matColumnDef="publicationYear">
        <th mat-header-cell *matHeaderCellDef>Año</th>
        <td mat-cell *matCellDef="let book">{{ book.publicationYear }}</td>
      </ng-container>

      <ng-container matColumnDef="availableCopies">
        <th mat-header-cell *matHeaderCellDef>Disponibles</th>
        <td mat-cell *matCellDef="let book">{{ book.availableCopies ?? '—' }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  }
</main>
